<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#ccff00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#04050d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="50%" stop-color="#0a0c18"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06140a"/>
      <stop offset="100%" stop-color="#0a1f0e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#04050d"/>
  <circle cx="400" cy="320" r="320" fill="url(#halo)"/>
  <!-- Holographic console card -->
  <g transform="translate(180, 140)">
    <rect x="0" y="0" width="440" height="280" rx="14" fill="url(#screen)" stroke="#ccff00" stroke-width="1.5" opacity="0.85"/>
    <rect x="18" y="22" width="60" height="10" fill="#ccff00" opacity="0.8"/>
    <rect x="18" y="42" width="120" height="6" fill="#ccff00" opacity="0.45"/>
    <rect x="18" y="56" width="90" height="6" fill="#ccff00" opacity="0.3"/>
    <!-- chart bars -->
    <g transform="translate(18, 100)">
      <rect x="0" y="80" width="22" height="60" fill="#ccff00" opacity="0.9"/>
      <rect x="32" y="50" width="22" height="90" fill="#ccff00" opacity="0.7"/>
      <rect x="64" y="30" width="22" height="110" fill="#ccff00" opacity="0.85"/>
      <rect x="96" y="60" width="22" height="80" fill="#ccff00" opacity="0.6"/>
      <rect x="128" y="20" width="22" height="120" fill="#ccff00" opacity="0.95"/>
      <rect x="160" y="44" width="22" height="96" fill="#ccff00" opacity="0.55"/>
      <rect x="192" y="14" width="22" height="126" fill="#ccff00" opacity="1"/>
    </g>
    <!-- wordmark -->
    <text x="260" y="170" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48" fill="#ccff00" opacity="0.95" letter-spacing="-1">JADE</text>
    <text x="260" y="220" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48" fill="#ccff00" opacity="0.85" letter-spacing="-1">OS.</text>
  </g>
  <!-- Carabiner keyfob silhouette -->
  <g transform="translate(180, 460)" fill="none" stroke="#ccff00" stroke-width="3" opacity="0.9">
    <path d="M 0 80 L 0 40 Q 0 0 40 0 L 380 0 Q 440 0 440 60 L 440 100 Q 440 160 380 160 L 320 160 L 320 200 L 120 200 L 120 160 L 40 160 Q 0 160 0 120 Z"/>
    <!-- fingerprint sensor pad -->
    <circle cx="220" cy="40" r="22" stroke-width="2.5" opacity="0.95"/>
    <path d="M 208 40 Q 220 28 232 40 M 212 44 Q 220 36 228 44" stroke-width="1.5"/>
    <!-- LED edge accents -->
    <rect x="60" y="76" width="80" height="6" fill="#ccff00" stroke="none" opacity="0.95"/>
    <rect x="300" y="76" width="80" height="6" fill="#ccff00" stroke="none" opacity="0.95"/>
  </g>
  <!-- Corner brackets -->
  <g stroke="#ccff00" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 40 40 L 40 100 M 40 40 L 100 40"/>
    <path d="M 760 40 L 760 100 M 760 40 L 700 40"/>
    <path d="M 40 760 L 40 700 M 40 760 L 100 760"/>
    <path d="M 760 760 L 760 700 M 760 760 L 700 760"/>
  </g>
  <!-- caption -->
  <text x="400" y="730" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ccff00" text-anchor="middle" opacity="0.8" letter-spacing="3">QUANTA · OPERATOR KEYFOB</text>
</svg>
